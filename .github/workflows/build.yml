name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bettercontroller-jar
          path: build/libs/*.jar

      # Keeps one release ("latest-build") whose jar is always the newest successful build.
      - name: Publish jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: "Automatic build of ${{ github.sha }}. Put the jar into .minecraft/mods (NeoForge 21.1.265, Minecraft 1.21.1)."
          files: build/libs/bettercontroller-*.jar

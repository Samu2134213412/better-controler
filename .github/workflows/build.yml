name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      # Starts a real server and runs the game tests (src/main/java/.../gametest). The game test
      # server exits with code 0 even if it fails to start, so the log is checked as well.
      - name: Game tests without Create
        timeout-minutes: 10
        run: |
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log
          grep -q "required tests passed" gametest.log || { echo "::error::Game tests failed (see log above)"; exit 1; }

      - name: Game tests with Create
        timeout-minutes: 10
        run: |
          url=$(curl -fsS 'https://api.modrinth.com/v2/project/create/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D' \
            | jq -r '[.[] | select(.version_type == "release")][0].files[] | select(.primary) | .url')
          echo "Create: $url"
          mkdir -p run/mods
          curl -fsSL -o run/mods/create.jar "$url"
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest-create.log
          grep -q "Create found" gametest-create.log || { echo "::error::Create was not detected"; exit 1; }
          grep -q "required tests passed" gametest-create.log || { echo "::error::Game tests with Create failed (see log above)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: bettercontroller-jar
          path: build/libs/*.jar

      # Keeps one release ("latest-build") whose jar is always the newest successful build.
      - name: Publish jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          body: "Automatic build of ${{ github.sha }}. Put the jar into .minecraft/mods (NeoForge 21.1.265, Minecraft 1.21.1)."
          files: build/libs/bettercontroller-*.jar
